<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLMOrchestrator Admin</title>
    <link rel="stylesheet" href="/admin-ui/styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand-block">
          <h1>LLMOrchestrator</h1>
          <p>Admin Console</p>
        </div>
        <nav class="nav-stack">
          <button data-view="overview">Overview</button>
          <button data-view="requests">Requests</button>
          <button data-view="errors">Errors</button>
          <button data-view="queue">Queue</button>
          <button data-view="models">Models</button>
          <button data-view="config">Config</button>
          <button data-view="audit">Audit Logs</button>
        </nav>
      </aside>
      <main class="content">
        <section id="login-panel" class="panel auth-panel">
          <h2>Admin Login</h2>
          <form id="login-form">
            <input name="username" placeholder="Username" required />
            <input name="password" type="password" placeholder="Password" required />
            <button type="submit">Sign In</button>
          </form>
          <p id="login-message"></p>
        </section>
        <section id="app-panel" class="hidden">
          <header class="topbar">
            <div>
              <h2 id="view-title">Overview</h2>
              <div id="view-subtitle" class="muted small-copy"></div>
            </div>
            <div class="topbar-actions">
              <span id="session-indicator" class="muted"></span>
              <button id="live-toggle" class="secondary-btn">Live On</button>
              <button id="refresh-button">Refresh</button>
              <button id="logout-button" class="secondary-btn">Logout</button>
            </div>
          </header>
          <div id="view-container"></div>
          <div id="detail-drawer" class="detail-drawer hidden"></div>
        </section>
      </main>
    </div>
    <script src="/admin-ui/app.js"></script>
  </body>
</html>
