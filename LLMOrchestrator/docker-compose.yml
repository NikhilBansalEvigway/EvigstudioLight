services:
  redis:
    image: redis:7-alpine
    networks:
      - agent-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  llm-orchestrator:
    build: .
    ports:
      - "3013:3013"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - PYTHONPATH=/app
      - DATABASE_URL=sqlite+aiosqlite:////data/llm_orchestrator.db
      - TZ=Asia/Kolkata
      - APP_TIMEZONE=Asia/Kolkata
    volumes:
      - db-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      agent-net:
        aliases:
          - llm-orch
    depends_on:
      redis:
        condition: service_healthy

  llm-orchestrator-worker:
    build: .
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - PYTHONPATH=/app
      - DATABASE_URL=sqlite+aiosqlite:////data/llm_orchestrator.db
      - TZ=Asia/Kolkata
      - APP_TIMEZONE=Asia/Kolkata
    volumes:
      - db-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python app/worker.py
    networks:
      - agent-net
    depends_on:
      redis:
        condition: service_healthy
      llm-orchestrator:
        condition: service_started

volumes:
  db-data:

networks:
  agent-net:
    external: true
