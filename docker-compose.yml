## Default (server/offline) compose
## - Runs ONLY from already-available images (no builds)
## - Persists data in named volumes
## - Containers auto-start on reboot via `restart: unless-stopped`
##
## Initial server setup (one-time):
## 1) Load images (offline): `docker load -i <images>.tar`
## 2) Start stack:           `docker compose up -d`
## 3) Ensure Docker starts:  `sudo systemctl enable --now docker`

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: evigstudio
      POSTGRES_PASSWORD: evigstudio
      POSTGRES_DB: evigstudio
    volumes:
      - evigstudio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evigstudio"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: evigstudiolight-api:latest
    restart: unless-stopped
    # Keep env_file so deployers can provide secrets/config without rebuilding.
    env_file: ./server/.env.offline
    environment:
      # IMPORTANT: inside Docker, 127.0.0.1 is the container itself.
      DATABASE_URL: postgresql://evigstudio:evigstudio@db:5432/evigstudio
    depends_on:
      db:
        condition: service_healthy
      llm-orch:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  llm-orch:
    image: evigstudiolight-llm-orch:latest
    restart: unless-stopped
    ports:
      - "3013:3013"
    env_file:
      - ./LLMOrchestrator/.env.offline
    environment:
      # Ensure in-compose service DNS is used even if the env file is edited.
      REDIS_URL: redis://redis:6379
      DATABASE_URL: sqlite+aiosqlite:////data/llm_orchestrator.db
      PYTHONPATH: /app
    volumes:
      - llm-db-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      default:
        aliases:
          - llm-orch

  llm-orch-worker:
    image: evigstudiolight-llm-orch-worker:latest
    restart: unless-stopped
    env_file:
      - ./LLMOrchestrator/.env.offline
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: sqlite+aiosqlite:////data/llm_orchestrator.db
      PYTHONPATH: /app
    volumes:
      - llm-db-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python app/worker.py
    depends_on:
      redis:
        condition: service_healthy
      llm-orch:
        condition: service_started

  frontend:
    image: evigstudiolight-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api

networks:
  default:
    name: evigstudio-net

volumes:
  # Pin volume names so running compose from different folders
  # does not create a new empty DB volume (which can look like "lost data").
  llm-db-data:
    name: evigstudiolight_llm-db-data
  evigstudio_pgdata:
    name: evigstudiolight_evigstudio_pgdata
