# Offline stack: run EvigStudio Light fully offline.
# UI -> API (/api/llm) -> LLM Orchestrator queue -> LM Studio
#
# Usage:
#   docker compose -f docker-compose.offline.yml up -d

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  # The API connects to this via the docker network hostname `db`.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: evigstudio
      POSTGRES_PASSWORD: evigstudio
      POSTGRES_DB: evigstudio
    volumes:
      - evigstudio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evigstudio"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: evigstudiolight-api:latest
    # Use a dedicated env file for offline/orchestrator configuration.
    env_file: ./server/.env.offline
    environment:
      # IMPORTANT: inside Docker, 127.0.0.1 is the container itself.
      # Always point at the `db` service over the Compose network.
      DATABASE_URL: postgresql://evigstudio:evigstudio@db:5432/evigstudio
    depends_on:
      db:
        condition: service_healthy
      llm-orch:
        condition: service_started

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  llm-orch:
    image: evigstudiolight-llm-orch:latest
    restart: unless-stopped
    ports:
      - "3013:3013"
    env_file:
      - ./LLMOrchestrator/.env.offline
    environment:
      - REDIS_URL=redis://redis:6379
      - PYTHONPATH=/app
      - DATABASE_URL=sqlite+aiosqlite:////data/llm_orchestrator.db
    volumes:
      - llm-db-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      default:
        aliases:
          - llm-orch

  llm-orch-worker:
    image: evigstudiolight-llm-orch-worker:latest
    restart: unless-stopped
    env_file:
      - ./LLMOrchestrator/.env.offline
    environment:
      - REDIS_URL=redis://redis:6379
      - PYTHONPATH=/app
      - DATABASE_URL=sqlite+aiosqlite:////data/llm_orchestrator.db
    volumes:
      - llm-db-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python app/worker.py
    depends_on:
      redis:
        condition: service_healthy
      llm-orch:
        condition: service_started

  frontend:
    image: evigstudiolight-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api

volumes:
  # Orchestrator state (queue DB). Compose will create this volume if missing.
  llm-db-data:

  # PostgreSQL data
  evigstudio_pgdata:
