

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: evigstudio
      POSTGRES_PASSWORD: evigstudio
      POSTGRES_DB: evigstudio
    volumes:
      - patched_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evigstudio"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: evigstudio-patched-api:latest
    build:
      context: ./server
    restart: unless-stopped
    env_file: ./server/.env.offline
    environment:
      DATABASE_URL: postgresql://evigstudio:evigstudio@db:5432/evigstudio
    depends_on:
      db:
        condition: service_healthy
      llm-orch:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  llm-orch:
    image: evigstudio-patched-llm-orch:latest
    build:
      context: ./LLMOrchestrator
    restart: unless-stopped
    ports:
      - "3013:3013"
    env_file:
      - ./LLMOrchestrator/.env.offline
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: sqlite+aiosqlite:////data/llm_orchestrator.db
      PYTHONPATH: /app
    volumes:
      - patched_llm_db:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      default:
        aliases:
          - llm-orch

  llm-orch-worker:
    image: evigstudio-patched-llm-orch-worker:latest
    build:
      context: ./LLMOrchestrator
    restart: unless-stopped
    env_file:
      - ./LLMOrchestrator/.env.offline
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: sqlite+aiosqlite:////data/llm_orchestrator.db
      PYTHONPATH: /app
    volumes:
      - patched_llm_db:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python app/worker.py
    depends_on:
      redis:
        condition: service_healthy
      llm-orch:
        condition: service_started

  frontend:
    image: evigstudio-patched-frontend:latest
    build:
      context: .
      dockerfile: ./src/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api

networks:
  default:
    name: evigstudio-patched-net

volumes:
  patched_pgdata:
    name: evigstudio_patched_pgdata
  patched_llm_db:
    name: evigstudio_patched_llm_db
